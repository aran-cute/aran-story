
<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چیرۆکێک بۆ ئاران 💗</title>

<style>
:root {
  --bg1: #ffeef5;
  --bg2: #efe6ff;
  --tx: #6b3a55;
  --ac: #e07aa8;
  --card: rgba(255,255,255,.78);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  font-family: Tahoma, Arial, sans-serif;
  color: var(--tx);
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  overflow-x: hidden;
}

.hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.heart {
  position: absolute;
  bottom: -40px;
  color: #e07aa8;
  opacity: .45;
  animation: floatUp 10s linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  15% { opacity: .5; }
  to {
    transform: translateY(-115vh) rotate(35deg);
    opacity: 0;
  }
}

.card {
  width: 100%;
  max-width: 620px;
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 32px 23px;
  border-radius: 28px;
  background: var(--card);
  border: 1px solid rgba(255,255,255,.9);
  box-shadow: 0 18px 55px rgba(150,80,125,.15);
  backdrop-filter: blur(8px);
}

.flower {
  font-size: 36px;
  margin-bottom: 6px;
}

h1 {
  color: #c65389;
  font-size: 28px;
  margin: 8px 0;
}

.subtitle {
  font-size: 14px;
  opacity: .8;
  margin-bottom: 25px;
}

.story-box {
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 15px;
  border-radius: 22px;
  background: rgba(255,240,248,.8);
  border: 1px solid #f7d4e5;
}

#story {
  font-size: 21px;
  line-height: 2.1;
  opacity: 1;
  transition: opacity .3s, transform .3s;
}

#story.fade {
  opacity: 0;
  transform: translateY(8px);
}

.counter {
  font-size: 13px;
  margin-top: 15px;
  color: #a55c80;
}

.progress {
  height: 5px;
  background: #f4d5e4;
  border-radius: 10px;
  margin: 10px 0 22px;
  overflow: hidden;
}

#bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#e07aa8,#b59be9);
  transition: width .3s;
}

.buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

button {
  border: none;
  border-radius: 30px;
  padding: 12px 20px;
  font-size: 15px;
  font-family: inherit;
  cursor: pointer;
  transition: transform .2s;
}

button:active {
  transform: scale(.96);
}

.primary {
  color: white;
  background: linear-gradient(135deg,#e07aa8,#c77bb8);
  box-shadow: 0 5px 15px #e8b3d0;
}

.secondary {
  color: #9b5277;
  background: #fff0f7;
  border: 1px solid #f3d0e2;
}

.music-note {
  margin-top: 20px;
  font-size: 12px;
  opacity: .7;
  line-height: 1.8;
}

.footer {
  margin-top: 24px;
  font-size: 13px;
  color: #a55c80;
}

#music {
  margin-top: 13px;
}

@media (max-width: 420px) {
  .card { padding: 25px 16px; }
  h1 { font-size: 24px; }
  #story { font-size: 18px; }
  .story-box { min-height: 190px; }
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<main class="card">
  <div class="flower">🌸 💗 🌸</div>
  <h1>چیرۆکێک بۆ ئاران</h1>
  <div class="subtitle">چیرۆکێکی بچووک، بەڵام لە دڵێکی پڕ لە هەستەوە ❤️</div>

  <section class="story-box">
    <div id="story">ئەم چیرۆکە بە کرتەیەک دەست پێ دەکات... 🌷</div>
  </section>

  <div class="counter" id="counter">ئامادەی؟ 💕</div>
  <div class="progress"><div id="bar"></div></div>

  <div class="buttons">
    <button class="secondary" id="prev">→ پێشوو</button>
    <button class="primary" id="next">دەست پێ بکە 🌸</button>
  </div>

  <button class="secondary" id="music">♫ دەنگی ئارام چالاک بکە</button>

  <div class="music-note">
    بە هەر کرتەیەک، دەرگایەکی نوێ لە چیرۆکەکە دەکرێتەوە... 💌
  </div>

  <div class="footer">بە هەموو جوانییەکانی دڵەوە بۆ تۆ، ئاران گیان 🌹</div>
</main>

<script>
const sentences = [
  "لە ڕۆژی ١/١/٢٠٠٧، کوڕێک لە جیهاندا لەدایک بوو. 🌙",
  "ڕۆژێکی نوێ هاتبوو، بەڵام ئەو کوڕە خۆی جوانییەکی تایبەتی لەگەڵ خۆیدا هێنابوو. ✨",
  "ڕۆحێکی پاک، دڵێک سپی وەک بەفر، و نیگایەک پڕ لە هیوای بێکۆتایی. 🤍",
  "کات تێدەپەڕی و ئەو کوڕە هەر ڕۆژێک گەورەتر دەبوو.",
  "بەڵام لە ناو دڵیدا هەستێکی تایبەتی هەبوو کە هەمیشە ناتوانی بە ئاسانی باسی بکات. 💭",
  "هەندێ جار بێدەنگی دەبووە باشترین هاوڕێی.",
  "هەندێ جار تەنها بیرکردنەوە بوو کە دەتوانی هەموو ئەو هەستانە لە خۆی بگرێت.",
  "ئەو هەوڵی دەدا هەموو شتێک لە ناو دڵیدا بشارێتەوە. 🌧️",
  "بەڵام دڵ، هەمیشە هەموو ڕازێک بۆ هەتاهەتایە ناشارێتەوە.",
  "ڕۆژێک هات کە خۆی لە خۆی پرسیاری کرد...",
  "بۆچی من وا هەستم هەیە؟ 🤍",
  "بۆچی هەندێ شت بۆ من جیاوازە؟",
  "بۆچی هەندێ هەست بە وشە ناتوانرێت باس بکرێت؟",
  "ئەو پرسیارانە لە دڵیدا دەسووڕانەوە، وەک ئەستێرە لە ئاسمانێکی تاریکدا. 🌌",
  "بەڵام لەگەڵ هەموو ئەو بیرکردنەوانەش، ئەو هێشتا هیوای بە ڕۆژانی جوان هەبوو.",
  "چونکە هەر دڵێک، هەرچەندە بێدەنگ بێت، شایەنی ئارامی و خۆشەویستییە. 💗",
  "هەندێ جار تەنها پێویستە کەسێک گوێت لێ بگرێت.",
  "کەسێک کە بەبێ پرسیارکردن، هەستەکانت تێبگات.",
  "کەسێک کە لەگەڵیدا دەتوانیت خۆت بیت، بەبێ ترس و بەبێ شاردنەوە. 🌷",
  "ژیان هەمیشە بە ئاسانی ناڕوات، بەڵام هەر ڕۆژێک دەرفەتێکی نوێیە.",
  "هەندێ ڕۆژ پڕ لە خەندەن، هەندێ ڕۆژ پڕ لە بیرکردنەوە.",
  "بەڵام هیچ شەوێک هەتاهەتایە نامێنێت؛ ڕۆژ هەمیشە دووبارە دێتەوە. ☀️",
  "ئاران گیان، تۆش شایەنی ڕۆژانی ئارام و دڵێکی پڕ لە خۆشییت.",
  "شایەنی خەندەیەک کە لە دڵەوە بێت، نەک تەنها لەسەر لێوەکانت.",
  "شایەنی خەونەکانیت، هەرچەندە گەورە و دوور بن. 🌠",
  "شایەنی ئەوەیت کە ڕۆژێک سەیری ڕابردووت بکەیت و بە خۆت بڵێیت: من زۆر بەهێز بووم.",
  "لەوانەیە هەموو کەس نەتوانێت هەستەکانت تێبگات.",
  "بەڵام ئەوە واتای ئەوە نییە کە هەستەکانت کەمتر گرنگن.",
  "تۆ بەو شێوەیەی کە هەیت، گرنگیت. 💗",
  "وەک گوڵێک کە بە ئارامی گەشە دەکات، ژیانتیش دەتوانێت پڕ لە جوانی بێت.",
  "هەنگاو بە هەنگاو، بە هیوایەکی بچووک و دڵێکی ئارام.",
  "ئەم چیرۆکە کۆتایی هاتووە، بەڵام چیرۆکی ژیانت هێشتا بەردەوامە. 🌹",
  "ئەو ڕۆژە دێت، ئاران گیان، ژیانێکی جوان وەک ناوەکەی خۆت، ئارام و جوان و گەشاوە و پڕ گوڵ.",
  "هیوادارم خەندە هەمیشە ڕێگای بۆ دڵت بدۆزێتەوە.",
  "هیوادارم ئارامی ببێتە هاوڕێی هەموو ڕۆژەکانت. 🌸",
  "و ئەگەر ڕۆژێک ئەم چیرۆکە بخوێنیتەوە، بیرت بێت کە هەرگیز خۆشی و هیوا لەبیر مەکە.",
  "خواحافیز، خۆشمدەوێی ❤️🌹"
];

let index = -1;

const story = document.getElementById("story");
const counter = document.getElementById("counter");
const bar = document.getElementById("bar");
const next = document.getElementById("next");
const prev = document.getElementById("prev");

function showSentence(newIndex) {
  if (newIndex < 0 || newIndex >= sentences.length) return;

  index = newIndex;
  story.classList.add("fade");

  setTimeout(() => {
    story.textContent = sentences[index];
    story.classList.remove("fade");

    counter.textContent =
      `بەشی ${index + 1} لە ${sentences.length} 💗`;

    bar.style.width =
      ((index + 1) / sentences.length * 100) + "%";

    next.textContent =
      index === sentences.length - 1
        ? "خواحافیز، خۆشمدەوێی ❤️"
        : "بەردەوام بە 🌸";

    prev.disabled = index === 0;
    prev.style.opacity = index === 0 ? ".45" : "1";
  }, 220);
}

next.addEventListener("click", () => {
  if (index === -1) {
    showSentence(0);
  } else if (index < sentences.length - 1) {
    showSentence(index + 1);
  } else {
    story.classList.add("fade");
    setTimeout(() => {
      story.textContent = "خواحافیز، خۆشمدەوێی ❤️🌹";
      story.classList.remove("fade");
    }, 220);
  }
});

prev.addEventListener("click", () => {
  if (index > 0) showSentence(index - 1);
});

const hearts = document.getElementById("hearts");
for (let i = 0; i < 22; i++) {
  const heart = document.createElement("span");
  heart.className = "heart";
  heart.textContent = ["♡", "♥", "🌸", "✿"][i % 4];
  heart.style.left = Math.random() * 100 + "%";
  heart.style.animationDelay = Math.random() * 10 + "s";
  heart.style.animationDuration = (8 + Math.random() * 8) + "s";
  heart.style.fontSize = (14 + Math.random() * 18) + "px";
  hearts.appendChild(heart);
}

let audioContext;
let musicTimer;
let musicPlaying = false;
let noteIndex = 0;

const melody = [
  261.63, 329.63, 392.00, 329.63,
  293.66, 349.23, 440.00, 349.23,
  261.63, 329.63, 392.00, 523.25,
  440.00, 392.00, 329.63, 293.66
];

function playNote(frequency) {
  if (!audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.045, audioContext.currentTime + 0.08
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001, audioContext.currentTime + 0.65
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.7);
}

document.getElementById("music").addEventListener("click", async () => {
  const musicButton = document.getElementById("music");

  if (!musicPlaying) {
    try {
      audioContext = audioContext ||
        new (window.AudioContext || window.webkitAudioContext)();

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      musicPlaying = true;
      musicButton.textContent = "♫ دەنگی ئارام بوەستێنە";

      playNote(melody[noteIndex % melody.length]);
      noteIndex++;

      musicTimer = setInterval(() => {
        playNote(melody[noteIndex % melody.length]);
        noteIndex++;
      }, 650);
    } catch (error) {
      musicButton.textContent = "دەنگەکە لەم وێبگەڕەدا کار ناکات";
    }
  } else {
    musicPlaying = false;
    clearInterval(musicTimer);
    musicButton.textContent = "♫ دەنگی ئارام چالاک بکە";
  }
});
</script>

</body>
</html>
