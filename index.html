
<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ئارانی جوانکیلە 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Tahoma, Arial, sans-serif;
  color: #78445e;
  background:
    radial-gradient(circle at top left, #fff8fc, transparent 40%),
    linear-gradient(145deg, #ffe4ef, #f1e5ff, #fff0f6);
  overflow: hidden;
}

.petals {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.petal {
  position: absolute;
  bottom: -50px;
  animation: float 12s linear infinite;
  opacity: .55;
}

@keyframes float {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  15% { opacity: .6; }
  100% {
    transform: translateY(-115vh) rotate(180deg);
    opacity: 0;
  }
}

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 540px;
  padding: 30px 22px 24px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 32px;
  background: rgba(255,255,255,.78);
  box-shadow: 0 20px 60px rgba(177,101,145,.2);
  backdrop-filter: blur(12px);
}

.decor {
  font-size: 30px;
  letter-spacing: 5px;
}

h1 {
  margin: 12px 0 24px;
  color: #cb5a91;
  font-size: 29px;
  text-shadow: 0 2px 10px #f8d4e5;
}

.line {
  width: 80px;
  height: 3px;
  margin: -12px auto 25px;
  border-radius: 5px;
  background: linear-gradient(90deg, #e6a1c3, #c6a5ed);
}

.story-box {
  min-height: 210px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 15px;
  border-radius: 24px;
  background: linear-gradient(145deg, #fff5fa, #f9f1ff);
  border: 1px solid #f4d6e6;
}

#story {
  font-size: 21px;
  line-height: 2.1;
  color: #78445e;
  transition: opacity .3s, transform .3s;
}

#story.fade {
  opacity: 0;
  transform: translateY(8px);
}

.counter {
  margin-top: 16px;
  font-size: 13px;
  color: #b16c90;
}

.progress {
  height: 5px;
  margin: 12px 0 23px;
  background: #f5dce9;
  border-radius: 10px;
  overflow: hidden;
}

#bar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #e68db6, #b8a0ed);
  transition: width .35s;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

button {
  border: 0;
  border-radius: 30px;
  padding: 13px 21px;
  font-family: inherit;
  font-size: 15px;
  cursor: pointer;
  transition: transform .2s;
}

button:active {
  transform: scale(.96);
}

.primary {
  color: white;
  background: linear-gradient(135deg, #e58ab4, #c780bb);
  box-shadow: 0 5px 18px rgba(210,115,166,.25);
}

.secondary {
  color: #a65d82;
  background: #fff0f7;
  border: 1px solid #f1d1e2;
}

#music {
  margin-top: 15px;
}

.bottom-flowers {
  margin-top: 22px;
  font-size: 20px;
  letter-spacing: 5px;
}

@media(max-width: 420px) {
  .card {
    padding: 25px 15px 20px;
  }
  h1 {
    font-size: 25px;
  }
  #story {
    font-size: 18px;
  }
  .story-box {
    min-height: 200px;
  }
}
</style>
</head>

<body>

<div class="petals" id="petals"></div>

<main class="card">
  <div class="decor">🌸 ♡ 🌸</div>

  <h1>ئارانی جوانکیلە 💗</h1>

  <div class="line"></div>

  <div class="story-box">
    <div id="story">ئارانی جوانکیلە، ئامادەی؟ 💕</div>
  </div>

  <div class="counter" id="counter">بە دڵەوە ❤️</div>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div class="buttons">
    <button class="secondary" id="prev">پێشوو</button>
    <button class="primary" id="next">بەردەوام بە 💗</button>
  </div>

  <button class="secondary" id="music">♫ دەنگی ئارام چالاک بکە</button>

  <div class="bottom-flowers">🌷 💗 🌷</div>
</main>

<script>
const sentences = [
  "لە ڕۆژی ١/١/٢٠٠٧، کوڕێک لەدایک بوو. 🌙",
  "ڕۆحێکی پاک و دڵێک سپی وەک بەفر، جوانییەکی تایبەتیان هەبوو. 🤍",
  "کات تێدەپەڕی و ئەو کوڕە هەنگاو بە هەنگاو گەورەتر دەبوو.",
  "هەندێ هەست لە ناخیدا هەبوون کە بە وشە ئاسان نەدەبوو باس بکرێن.",
  "هەندێ جار بێدەنگ دەبوو و لە دڵی خۆی بیر دەکردەوە.",
  "بەڵام لە ناو دڵیدا هێشتا هیوای ڕۆژانی جوانی هەبوو. 🌸",
  "هەر کەسێک شایەنی ئارامی و خۆشییە.",
  "هەندێ جار تەنها پێویستە کەسێک گوێت لێ بگرێت و تێت بگات.",
  "ژیان هەمیشە ئاسان نییە، بەڵام هەر ڕۆژێک دەرفەتێکی نوێیە. ☀️",
  "هیوادارم دڵت هەمیشە ئارام بێت و خەندە لەسەر لێوت بمێنێتەوە.",
  "هیوادارم هەموو خەونە جوانەکانت ببنە ڕاستی.",
  "پەنجەیەک کە هەست بە نەرمی ڕوومەتە سوورەکانی بکات. 🌹",
  "هەندێ جوانی بە وشە ناگوترێت؛ تەنها بە هەست دەناسرێت.",
  "ئاران گیان، تۆ شایەنی ڕۆژانی جوان و دڵێکی پڕ لە خۆشییت. 💗",
  "هیوادارم هەر ڕۆژێک شتێکی جوان بۆ خەنداندنت هەبێت.",
  "ئەو ڕۆژە دێت ئاران گیان ژیانێکی جوان وەک ناوەکەی خۆت ئارام و جوان و گەشاوە و پڕ گوڵ. 🌸",
  "هەمیشە جوان بمێنەوە، ئارانی جوانکیلە.",
  "خواحافیز جوانکیلە ❤️"
];

let index = -1;

const story = document.getElementById("story");
const counter = document.getElementById("counter");
const bar = document.getElementById("bar");
const next = document.getElementById("next");
const prev = document.getElementById("prev");

function showSentence(newIndex) {
  if (newIndex < 0 || newIndex >= sentences.length) return;

  index = newIndex;
  story.classList.add("fade");

  setTimeout(() => {
    story.textContent = sentences[index];
    story.classList.remove("fade");

    counter.textContent = `${index + 1} / ${sentences.length}`;
    bar.style.width = ((index + 1) / sentences.length * 100) + "%";

    next.textContent = index === sentences.length - 1
      ? "خواحافیز جوانکیلە ❤️"
      : "بەردەوام بە 💗";

    prev.disabled = index === 0;
    prev.style.opacity = index === 0 ? ".4" : "1";
  }, 200);
}

next.addEventListener("click", () => {
  if (index === -1) {
    showSentence(0);
  } else if (index < sentences.length - 1) {
    showSentence(index + 1);
  }
});

prev.addEventListener("click", () => {
  if (index > 0) showSentence(index - 1);
});

const petals = document.getElementById("petals");

for (let i = 0; i < 22; i++) {
  const item = document.createElement("span");
  item.className = "petal";
  item.textContent = ["♡", "♥", "🌸", "✿"][i % 4];
  item.style.left = Math.random() * 100 + "%";
  item.style.animationDelay = Math.random() * 10 + "s";
  item.style.animationDuration = (8 + Math.random() * 8) + "s";
  item.style.fontSize = (14 + Math.random() * 18) + "px";
  petals.appendChild(item);
}

let audioContext;
let musicTimer;
let musicPlaying = false;
let noteIndex = 0;

const melody = [
  261.63, 329.63, 392.00, 329.63,
  293.66, 349.23, 440.00, 349.23,
  261.63, 329.63, 392.00, 523.25,
  440.00, 392.00, 329.63, 293.66
];

function playNote(frequency) {
  if (!audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.035, audioContext.currentTime + 0.08
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001, audioContext.currentTime + 0.65
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.7);
}

document.getElementById("music").addEventListener("click", async () => {
  const button = document.getElementById("music");

  if (!musicPlaying) {
    try {
      audioContext = audioContext ||
        new (window.AudioContext || window.webkitAudioContext)();

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      musicPlaying = true;
      button.textContent = "♫ دەنگەکە بوەستێنە";

      playNote(melody[noteIndex % melody.length]);
      noteIndex++;

      musicTimer = setInterval(() => {
        playNote(melody[noteIndex % melody.length]);
        noteIndex++;
      }, 650);
    } catch (error) {
      button.textContent = "دەنگەکە کار ناکات";
    }
  } else {
    musicPlaying = false;
    clearInterval(musicTimer);
    button.textContent = "♫ دەنگی ئارام چالاک بکە";
  }
});
</script>

</body>
</html>
