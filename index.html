
<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ئارانی جوانکیلە 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Tahoma, Arial, sans-serif;
  color: #75415d;
  background: linear-gradient(135deg, #ffe8f1, #eee4ff, #fff1f7);
  overflow-x: hidden;
}

.hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.heart {
  position: absolute;
  bottom: -40px;
  color: #e07aa8;
  opacity: .5;
  animation: floatUp 12s linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  20% {
    opacity: .5;
  }
  to {
    transform: translateY(-115vh) rotate(40deg);
    opacity: 0;
  }
}

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 600px;
  padding: 30px 22px;
  text-align: center;
  border-radius: 28px;
  background: rgba(255,255,255,.8);
  border: 1px solid white;
  box-shadow: 0 15px 50px rgba(180,100,145,.18);
}

.flowers {
  font-size: 34px;
  margin-bottom: 12px;
}

h1 {
  margin: 8px 0 25px;
  color: #cb5d91;
  font-size: 30px;
}

.story-box {
  min-height: 200px;
  padding: 25px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 22px;
  background: #fff1f7;
  border: 1px solid #f5d4e4;
}

#story {
  font-size: 21px;
  line-height: 2.1;
  transition: opacity .3s, transform .3s;
}

#story.fade {
  opacity: 0;
  transform: translateY(8px);
}

.counter {
  margin-top: 16px;
  font-size: 13px;
  color: #ad6386;
}

.progress {
  height: 5px;
  margin: 12px 0 22px;
  overflow: hidden;
  border-radius: 20px;
  background: #f5d6e5;
}

#bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #e07aa8, #b89ae9);
  transition: width .3s;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

button {
  font-family: inherit;
  font-size: 15px;
  padding: 12px 20px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
}

.primary {
  color: white;
  background: linear-gradient(135deg, #e07aa8, #c77bb8);
  box-shadow: 0 5px 15px #f0c5dc;
}

.secondary {
  color: #a4537c;
  background: #fff0f7;
  border: 1px solid #f3d0e2;
}

button:active {
  transform: scale(.97);
}

#music {
  margin-top: 15px;
}

.footer {
  margin-top: 23px;
  color: #b06488;
  font-size: 14px;
}

@media(max-width:420px) {
  .card {
    padding: 25px 15px;
  }

  h1 {
    font-size: 26px;
  }

  #story {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<main class="card">
  <div class="flowers">🌸 💗 🌸</div>

  <h1>ئارانی جوانکیلە 🌸💗</h1>

  <div class="story-box">
    <div id="story">کرتەیەک بکە، جوانکیلە 💗</div>
  </div>

  <div class="counter" id="counter">بە دڵەوە بۆ تۆ 🌷</div>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div class="buttons">
    <button class="secondary" id="prev">پێشوو</button>
    <button class="primary" id="next">بەردەوام بە 💗</button>
  </div>

  <button class="secondary" id="music">♫ دەنگی ئارام چالاک بکە</button>

  <div class="footer">🌷 💗 🌷</div>
</main>

<script>
const sentences = [
  "لە ڕۆژی ١/١/٢٠٠٧، کوڕێک لەدایک بوو. 🌙",
  "ڕۆحێکی پاک، دڵێک سپی وەک بەفر، و هەستێکی جوان لە ناخیدا هەبوو. 🤍",
  "بە تێپەڕبوونی کات، ئەو کوڕە گەورەتر دەبوو و جیهانیش بۆی فراوانتر دەبوو.",
  "لە ناو دڵیدا هەست و بیرکردنەوەی تایبەتی هەبوون.",
  "هەندێ جار هەستی دەکرد کە وشەکان ناتوانن هەموو ئەوەی لە دڵیدایە دەرببڕن.",
  "بۆیە هەندێ شت لە ناخیدا دەهێشتەوە و بێدەنگ دەبوو. 💭",
  "بەڵام دڵ هەمیشە ڕازەکانی خۆی بە تەواوی ناشارێتەوە.",
  "ڕۆژێک هات کە لە خۆی پرسی: بۆچی من وا هەستم هەیە؟",
  "بۆچی هەندێ هەست ئەوەندە قووڵن کە بە وشە باس ناکرێن؟",
  "لەگەڵ هەموو ئەو پرسیارانە، هێشتا هیوای بە ڕۆژانی جوان هەبوو. 🌷",
  "چونکە هەر کەسێک شایەنی ئارامی، خۆشی و خۆشەویستییە.",
  "هەندێ جار تەنها پێویستە کەسێک گوێت لێ بگرێت و بە دڵەوە تێت بگات.",
  "کەسێک کە لەگەڵیدا بتوانیت خۆت بیت، بەبێ ترس و شاردنەوە.",
  "ژیان هەمیشە ئاسان نییە، بەڵام هەر ڕۆژێک دەرفەتێکی نوێیە. ☀️",
  "هەندێ ڕۆژ پڕ لە خەندەن و هەندێ ڕۆژ پڕ لە بیرکردنەوە.",
  "بەڵام دوای هەر شەوێک، ڕۆژێکی نوێ دێتەوە.",
  "ئاران گیان، هیوادارم دڵت هەمیشە ئارام و لێوت پڕ لە خەندە بێت. 💗",
  "هیوادارم هەموو خەونە جوانەکانت ببنە ڕاستی.",
  "هیوادارم هەمیشە کەسانێکت لە دەوروبەر بن کە بە دڵەوە خۆشییانت بوێت.",
  "تۆ شایەنی ڕۆژانی جوان و ساتە خۆشەکانیت. 🌸",
  "وەک گوڵێک کە بە ئارامی گەشە دەکات، هیوادارم ژیانتیش پڕ لە جوانی بێت.",
  "هەنگاو بە هەنگاو، بە هیوایەکی نوێ و دڵێکی ئارام.",
  "هەرگیز خەونە جوانەکانت لەبیر مەکە، تەنانەت ئەگەر ڕێگاکە درێژ بێت.",
  "هەمیشە بە خۆت باوەڕت هەبێت و بە جوانیی دڵت شانازی بکەیت. 🤍",
  "پەنجەیەک کە هەست بە نەرمی ڕوومەتە سوورەکانی بکات. 🌹",
  "ساتێکی ئارام، نیگایەکی جوان و خەندەیەک کە لە دڵەوە بێت.",
  "هەندێ جوانی بە وشە ناگوترێت؛ تەنها بە هەست دەناسرێت.",
  "ئاران گیان، هیوادارم ژیانت هەمیشە پڕ لە ئارامی و خۆشی بێت.",
  "ئەو ڕۆژە دێت، ئاران گیان، ژیانێکی جوان وەک ناوەکەی خۆت ئارام و جوان و گەشاوە و پڕ گوڵ. 🌸",
  "هیوادارم خەندە هەمیشە ڕێگای بۆ دڵت بدۆزێتەوە.",
  "هیوادارم هەر ڕۆژێک شتێکی جوان بۆ خۆشی دڵت هەبێت.",
  "هەمیشە جوان بمێنەوە، جوانکیلەی دڵ. 💗",
  "خواحافیز جوانکیلە ❤️🌹"
];

let index = -1;

const story = document.getElementById("story");
const counter = document.getElementById("counter");
const bar = document.getElementById("bar");
const next = document.getElementById("next");
const prev = document.getElementById("prev");

function showSentence(newIndex) {
  if (newIndex < 0 || newIndex >= sentences.length) return;

  index = newIndex;
  story.classList.add("fade");

  setTimeout(() => {
    story.textContent = sentences[index];
    story.classList.remove("fade");

    counter.textContent = `${index + 1} / ${sentences.length}`;
    bar.style.width = ((index + 1) / sentences.length * 100) + "%";

    next.textContent = index === sentences.length - 1
      ? "خواحافیز جوانکیلە ❤️"
      : "بەردەوام بە 💗";

    prev.disabled = index === 0;
    prev.style.opacity = index === 0 ? ".4" : "1";
  }, 200);
}

next.addEventListener("click", () => {
  if (index === -1) {
    showSentence(0);
  } else if (index < sentences.length - 1) {
    showSentence(index + 1);
  }
});

prev.addEventListener("click", () => {
  if (index > 0) showSentence(index - 1);
});

const hearts = document.getElementById("hearts");

for (let i = 0; i < 22; i++) {
  const heart = document.createElement("span");
  heart.className = "heart";
  heart.textContent = ["♡", "♥", "🌸", "✿"][i % 4];
  heart.style.left = Math.random() * 100 + "%";
  heart.style.animationDelay = Math.random() * 10 + "s";
  heart.style.animationDuration = (8 + Math.random() * 8) + "s";
  heart.style.fontSize = (14 + Math.random() * 18) + "px";
  hearts.appendChild(heart);
}

let audioContext;
let musicTimer;
let musicPlaying = false;
let noteIndex = 0;

const melody = [
  261.63, 329.63, 392.00, 329.63,
  293.66, 349.23, 440.00, 349.23,
  261.63, 329.63, 392.00, 523.25,
  440.00, 392.00, 329.63, 293.66
];

function playNote(frequency) {
  if (!audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.035, audioContext.currentTime + 0.08
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001, audioContext.currentTime + 0.65
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.7);
}

document.getElementById("music").addEventListener("click", async () => {
  const musicButton = document.getElementById("music");

  if (!musicPlaying) {
    try {
      audioContext = audioContext ||
        new (window.AudioContext || window.webkitAudioContext)();

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      musicPlaying = true;
      musicButton.textContent = "♫ دەنگەکە بوەستێنە";

      playNote(melody[noteIndex % melody.length]);
      noteIndex++;

      musicTimer = setInterval(() => {
        playNote(melody[noteIndex % melody.length]);
        noteIndex++;
      }, 650);
    } catch (error) {
      musicButton.textContent = "دەنگەکە کار ناکات";
    }
  } else {
    musicPlaying = false;
    clearInterval(musicTimer);
    musicButton.textContent = "♫ دەنگی ئارام چالاک بکە";
  }
});
</script>

</body>
</html>
