<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>چیڕۆک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#cfe6f7; --bg2:#e4f1fb; --ink:#35566f; --bear:#f9bcd3; --bear-d:#f08fb4; --blush:#f4799f; --nose:#c95a82;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1c2e3f; --bg2:#27415a; --ink:#e2f0fb; --bear:#f4a9c6; --bear-d:#e27da6; }
}
:root[data-theme="dark"]{ --bg:#1c2e3f; --bg2:#27415a; --ink:#e2f0fb; --bear:#f4a9c6; --bear-d:#e27da6; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 90% at 50% 0%, var(--bg2), var(--bg));
  color:var(--ink); font-family:"Vazirmatn","Noto Naskh Arabic",Tahoma,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  overflow:hidden; -webkit-tap-highlight-color:transparent;
}
.stage{flex:1; width:100%; max-width:34rem; display:flex; align-items:center; justify-content:center; padding:2rem 1.75rem 0}
#line{
  margin:0; text-align:center; font-size:clamp(1.35rem,5.2vw,1.9rem); line-height:2; font-weight:600;
  white-space:pre-line; opacity:0; transform:translateY(10px); transition:opacity .5s ease, transform .5s ease;
}
#line.on{opacity:1; transform:none}
.dock{padding:1rem 0 1.5rem; display:flex; justify-content:center}
#bear{
